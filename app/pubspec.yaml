name: pancartplayer
description: "PancartPlayer — plateforme libre : n'importe quel modèle, n'importe quelle IA."
publish_to: "none"
version: 0.2.0

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  dio: ^5.7.0
  file_selector: ^1.0.3
  android_intent_plus: ^6.1.0
  llamadart: ^0.8.23

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android-web:
    name: Android + Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap
        run: bash scripts/bootstrap.sh

      - name: Analyze + tests
        run: |
          cd app
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build APK
        run: |
          cd app
          flutter build apk --release
          mkdir -p ../launcher/android
          cp build/app/outputs/flutter-apk/app-release.apk ../launcher/android/pancartplayer.apk

      - name: Build Web
        run: |
          cd app
          flutter build web --release
          rm -rf ../launcher/web
          mkdir -p ../launcher/web
          cp -r build/web/* ../launcher/web/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: launcher/android/pancartplayer.apk

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: launcher/web/

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install deps Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - name: Bootstrap
        run: bash scripts/bootstrap.sh
      - name: Build Linux
        run: |
          cd app
          flutter build linux --release
          rm -rf ../launcher/linux
          mkdir -p ../launcher/linux
          cp -r build/linux/x64/release/bundle/* ../launcher/linux/
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: launcher/linux/

  macos-ios:
    name: macOS + iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap
        run: bash scripts/bootstrap.sh
      - name: Build macOS
        run: |
          cd app
          flutter build macos --release
          rm -rf ../launcher/macos
          mkdir -p ../launcher/macos
          cp -r build/macos/Build/Products/Release/* ../launcher/macos/
      - name: Build iOS (non signé)
        run: |
          cd app
          flutter build ios --release --no-codesign
          rm -rf ../launcher/ios
          mkdir -p ../launcher/ios
          cp -r build/ios/iphoneos/*.app ../launcher/ios/
      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: launcher/macos/
      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: launcher/ios/

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap
        shell: bash
        run: bash scripts/bootstrap.sh
      - name: Build Windows
        shell: bash
        run: |
          cd app
          flutter build windows --release
          rm -rf ../launcher/windows
          mkdir -p ../launcher/windows
          cp -r build/windows/x64/runner/Release/* ../launcher/windows/
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: launcher/windows/